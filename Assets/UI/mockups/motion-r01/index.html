<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆勇者 · 首版动效参考 R01</title>
<style>
@font-face{font-family:Han;src:url('assets/SourceHanSansSC-Regular.otf')}*{box-sizing:border-box}body{margin:0;background:#202a2d;color:#252f32;font:18px Han,sans-serif}header{padding:24px 4%;color:#f1eee2}h1{margin:0 0 12px;font-size:30px}header p{margin:8px 0}.grid{padding:0 4% 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}section{background:#e7e5d8;padding:18px;border:3px double #87918a}h2{font-size:22px;margin:0}button{font:inherit;background:#283a40;color:#f1eee2;border:3px double #91adb2;padding:8px 20px;cursor:pointer}button:focus-visible{outline:3px solid #648891;outline-offset:4px}.stage{height:235px;position:relative;display:flex;align-items:center;justify-content:center;gap:20px;overflow:hidden}.card{width:120px;height:160px;object-fit:contain}.actor{width:165px;height:210px;object-fit:contain;transform-origin:50% 90%}.flip{width:120px;height:160px;position:relative;transform-style:preserve-3d}.flip img{position:absolute;inset:0;backface-visibility:hidden}.flip .front{transform:rotateY(180deg)}.play .flip{animation:flip 300ms ease-out forwards}.play .match{animation:match 400ms ease-in forwards}.play .mismatch{animation:mismatch 220ms ease-out}.play .flow{animation:flow 350ms ease-in forwards}.play .swap.a{animation:swapA 500ms ease-in-out forwards}.play .swap.b{animation:swapB 500ms ease-in-out forwards}.value{position:absolute;top:95px;font-size:32px;color:#8d3d35;opacity:0}.value.heal{left:67%;color:#355c67}.play .value{animation:float 1000ms ease-out forwards}.play .hit{animation:hit 280ms ease-out}.play .attack{animation:attack 380ms ease-in-out}.play .death{animation:death 500ms ease-in forwards}.play .idle{animation:idle 1800ms ease-in-out 2}.seal{position:absolute;width:80px;opacity:0}.play .seal{animation:stamp 280ms ease-out forwards}.bar{width:90%;display:flex;gap:5px}.bar i{height:24px;flex:1;background:#c3c7bc;border:1px solid #657174}.bar i:nth-child(-n+7){background:#648891}.play .bar i:nth-child(n+8){animation:fill 300ms ease-out forwards}.play .bar i:nth-child(9){animation-delay:100ms}.play .bar i:nth-child(10){animation-delay:200ms}.phase{position:absolute;bottom:12px;font-size:22px;color:#8d3d35}.play .boss{animation:phase 500ms ease-out forwards}.play .relic{animation:relic 400ms ease-out}.note{font-size:14px;min-height:42px;color:#48575a}.relic{width:135px;height:135px;object-fit:contain}@keyframes flip{to{transform:rotateY(180deg)}}@keyframes match{0%,45%{filter:drop-shadow(0 0 8px #648891)}to{opacity:0;transform:scale(.92)}}@keyframes mismatch{50%{filter:drop-shadow(0 0 5px #8d3d35)}}@keyframes flow{to{transform:translate(130px,65px) scale(.25);opacity:0}}@keyframes swapA{50%{transform:translate(70px,-35px)}to{transform:translateX(140px)}}@keyframes swapB{50%{transform:translate(-70px,35px)}to{transform:translateX(-140px)}}@keyframes float{0%{opacity:1}to{opacity:0;transform:translateY(-60px)}}@keyframes hit{35%{transform:translateX(9px);filter:sepia(.4)}to{transform:translateX(0)}}@keyframes attack{40%{transform:translateX(-28px)}to{transform:translateX(0)}}@keyframes death{to{opacity:0;transform:translateY(15px)}}@keyframes idle{50%{transform:translateY(-4px)}}@keyframes stamp{0%{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}@keyframes fill{to{background:#8d3d35}}@keyframes phase{50%{filter:drop-shadow(0 0 14px #8d3d35)}to{filter:drop-shadow(0 0 5px #8d3d35)}}@keyframes relic{50%{transform:scale(1.08);filter:drop-shadow(0 0 8px #648891)}}@media(prefers-reduced-motion:reduce){.play *{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}body.reduce .play *{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
</style><header><h1>首版动效参考 · R01</h1><p>复用正式静态资源，以位移、缩放、透明度和独立效果层表现动作。点击各项播放，不会自动循环。</p><label><input id="reduce" type="checkbox"> 减少动态</label><p>这是设计演示；不包含游戏结算、随机抽取或角色骨骼动画。</p></header><main class="grid" id="grid"></main>
<script>
const A='assets/',back=A+'cardbacks/cardback_universal_ornate_c03.png',front='assets/card_1_review.png',enemy=A+'enemies/enemy_goblin_etching_b01.png',boss=A+'enemies/enemy_memory_devourer_etching_f01.png';
const img=(src,c='card')=>`<img src="${src}" class="${c}" alt="">`;
const scenes=[
 ['翻牌 / 300ms',`<div class="flip">${img(back)}${img(front,'card front')}</div>`,'90°时由背面切到正面；不显示背面身份。'],
 ['配对成功 / 400ms',img(front,'card match')+img(front,'card match'),'原格心淡出，效果结算由客户端驱动，不向中点搬动牌阵。'],
 ['不匹配 / 220ms',img(front,'card mismatch'),'短暂边缘提示；保持正面，不能自动翻回。'],
 ['牌区流转 / 350ms',img(front,'card flow'),'终点由实际牌区锚点决定，示例不定义规则。'],
 ['换位 / 500ms',img(back,'card swap a')+img(back,'card swap b'),'两张牌沿相反弧线互换，换位本身不翻开。'],
 ['受击 / 飘字',img(enemy,'actor hit')+'<span class="value">−6</span><span class="value heal">+5</span>','受击280ms，伤害／治疗飘字1000ms；数字是演示值。'],
 ['攻击 / 380ms',img(enemy,'actor attack'),'轻量前冲后回位，脚底锚点保持一致。'],
 ['待机 / 1800ms',img(enemy,'actor idle'),'点击后仅播放两轮轻微呼吸，可减少动态。'],
 ['死亡 / 500ms',img(enemy,'actor death'),'淡出后客户端隐藏对象；不影响死亡中断规则。'],
 ['封锁盖印 / 280ms',img(back)+img(A+'overlays/seal_pairing_b03.png','seal'),'盖印独立层，背面仍不透露卡牌类型。'],
 ['行动条临界',`<div class="bar">${'<i></i>'.repeat(10)}</div>`,'条段数量、阈值和停机来自真实状态，演示只显示颜色推进。'],
 ['Boss阶段提示',img(boss,'actor boss')+'<span class="phase">阶段 II</span>','沿用Boss基础立绘，颜色与文字提示阶段，非新阶段造型。'],
 ['遗物触发 / 400ms',img(A+'relics/relic_memory_crystal_etching_e01.png','relic'),'缩放至1.08后回位，不常驻闪烁。']
];
for(const [title,body,note] of scenes){let s=document.createElement('section');s.innerHTML=`<h2>${title}</h2><div class="stage">${body}</div><p class="note">${note}</p><button>播放</button>`;s.querySelector('button').onclick=()=>{s.classList.remove('play');void s.offsetWidth;s.classList.add('play')};grid.append(s)}
document.querySelector('#reduce').onchange=e=>document.body.classList.toggle('reduce',e.target.checked);
</script></html>
