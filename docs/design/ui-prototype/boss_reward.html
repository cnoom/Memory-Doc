<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - Boss遗物奖励</title>
<link rel="stylesheet" href="common.css">
<style>
.boss-reward-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    background: radial-gradient(ellipse at 50% 30%, #2A1A18 0%, #1A1010 70%, #0A0505 100%);
}

.boss-title {
    font-size: 32px;
    font-weight: bold;
    color: var(--warning);
    letter-spacing: 4px;
    text-shadow: 0 0 16px rgba(232,74,32,0.5);
}

.boss-subtitle {
    font-size: 16px;
    color: var(--text-dim);
    text-align: center;
}

.relic-cards {
    display: flex;
    gap: 40px;
}

.relic-card {
    width: 220px;
    background: linear-gradient(180deg, #2A2520 0%, #1E1810 100%);
    border: 3px solid var(--warning);
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
}

.relic-card:hover {
    transform: translateY(-12px);
    box-shadow: 0 0 32px rgba(232,123,53,0.4);
    border-color: var(--gold);
}

.relic-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 80px;
    background: radial-gradient(ellipse at 50% 0%, rgba(232,123,53,0.15) 0%, transparent 70%);
    pointer-events: none;
}

.relic-card-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 12px;
    border-radius: 50%;
    border: 3px solid var(--warning);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: radial-gradient(ellipse at 35% 35%, rgba(232,123,53,0.2), rgba(0,0,0,0.5));
    box-shadow: 0 0 16px rgba(232,123,53,0.3);
}

.relic-card-name {
    font-size: 18px;
    font-weight: bold;
    color: var(--warning);
    margin-bottom: 4px;
}

.relic-card-rarity {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 2px;
}

.relic-card-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-main);
    padding: 8px 0;
}

.relic-card-cost {
    margin-top: 12px;
    padding: 4px 0;
    font-size: 12px;
    color: var(--success);
    border-top: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<div class="boss-reward-screen">
    <div style="text-align:center">
        <div class="boss-title">👑 Boss 已击败</div>
        <div class="boss-subtitle">选择一件 Boss 遗物</div>
    </div>

    <div class="relic-cards">
        <div class="relic-card" onclick="selectRelic(this, '全知之眼')">
            <div class="relic-card-icon">👁</div>
            <div class="relic-card-name">全知之眼</div>
            <div class="relic-card-rarity">— Boss 遗物 —</div>
            <div class="relic-card-desc">
                场上可同时翻开的<br>牌数量 +1<br>
                <span style="color:var(--text-dim);font-size:11px">（从1变为2）</span>
            </div>
            <div class="relic-card-cost">代价: 无</div>
        </div>

        <div class="relic-card" onclick="selectRelic(this, '混沌核心')">
            <div class="relic-card-icon">🌀</div>
            <div class="relic-card-name">混沌核心</div>
            <div class="relic-card-rarity">— Boss 遗物 —</div>
            <div class="relic-card-desc">
                每回合开始时，随机<br>
                交换桌面2张牌位置，<br>
                然后揭示这2张牌
            </div>
            <div class="relic-card-cost">代价: 无</div>
        </div>

        <div class="relic-card" onclick="selectRelic(this, '记忆王冠')">
            <div class="relic-card-icon">👑</div>
            <div class="relic-card-name">记忆王冠</div>
            <div class="relic-card-rarity">— Boss 遗物 —</div>
            <div class="relic-card-desc">
                所有能力牌的<br>
                持续效果翻倍
            </div>
            <div class="relic-card-cost">代价: 无</div>
        </div>
    </div>
</div>

<script>
function selectRelic(el, name) {
    document.querySelectorAll('.relic-card').forEach(c => {
        c.style.borderColor = '';
        c.style.boxShadow = '';
    });
    el.style.borderColor = 'var(--success)';
    el.style.boxShadow = '0 0 32px rgba(91,168,91,0.5)';
    setTimeout(() => {
        alert('已选择: ' + name);
    }, 300);
}
</script>

</body>
</html>
