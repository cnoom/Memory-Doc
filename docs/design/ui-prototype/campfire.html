<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - 篝火</title>
<link rel="stylesheet" href="common.css">
<style>
.campfire-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: radial-gradient(ellipse at 50% 40%, #2A2018 0%, #1A1510 70%, #0A0805 100%);
}

.campfire-title {
    font-size: 28px;
    font-weight: bold;
    color: var(--warning);
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(232,123,53,0.5);
}

.fire-animation {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    animation: flicker 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(232,123,53,0.6));
}

@keyframes flicker {
    0%,100% { transform: scale(1) rotate(-2deg); }
    25% { transform: scale(1.05) rotate(1deg); }
    50% { transform: scale(0.98) rotate(-1deg); }
    75% { transform: scale(1.03) rotate(2deg); }
}

.choice-panel {
    background: rgba(42,37,32,0.8);
    border: 2px solid var(--border-gold);
    border-radius: 12px;
    padding: 24px 32px;
    text-align: center;
    max-width: 500px;
}

.choice-question {
    font-size: 18px;
    color: var(--text-dim);
    margin-bottom: 20px;
}

.choice-buttons {
    display: flex;
    gap: 24px;
    justify-content: center;
}

.choice-btn {
    width: 200px;
    padding: 20px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid;
    text-align: center;
}

.choice-btn:hover {
    transform: translateY(-6px);
}

.choice-rest {
    background: linear-gradient(180deg, rgba(91,168,91,0.15) 0%, rgba(91,168,91,0.05) 100%);
    border-color: var(--success);
}

.choice-rest:hover {
    box-shadow: 0 0 20px rgba(91,168,91,0.4);
}

.choice-upgrade {
    background: linear-gradient(180deg, rgba(74,156,212,0.15) 0%, rgba(74,156,212,0.05) 100%);
    border-color: var(--rarity-uncommon);
}

.choice-upgrade:hover {
    box-shadow: 0 0 20px rgba(74,156,212,0.4);
}

.choice-icon {
    font-size: 40px;
    margin-bottom: 8px;
}

.choice-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
}

.choice-rest .choice-name { color: var(--success); }
.choice-upgrade .choice-name { color: var(--rarity-uncommon); }

.choice-desc {
    font-size: 13px;
    color: var(--text-dim);
}

.choice-value {
    margin-top: 6px;
    font-size: 14px;
    font-weight: bold;
    color: var(--gold);
}
</style>
</head>
<body>

<div class="campfire-screen">
    <div class="campfire-title">🔥 篝火</div>

    <div class="fire-animation">🔥</div>

    <div class="choice-panel">
        <div class="choice-question">你要做什么？</div>
        <div class="choice-buttons">
            <div class="choice-btn choice-rest" onclick="alert('休息！\n回复 18 点血量（30%最大血量）')">
                <div class="choice-icon">💚</div>
                <div class="choice-name">休息</div>
                <div class="choice-desc">回复最大血量的 30%</div>
                <div class="choice-value">+18 HP</div>
            </div>
            <div class="choice-btn choice-upgrade" onclick="alert('升级！\n选择一张牌组中的卡牌进行升级')">
                <div class="choice-icon">⬆️</div>
                <div class="choice-name">升级卡牌</div>
                <div class="choice-desc">强化一张卡牌的效果</div>
                <div class="choice-value">选择卡牌 →</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
