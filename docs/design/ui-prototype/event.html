<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - 随机事件</title>
<link rel="stylesheet" href="common.css">
<style>
.event-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: radial-gradient(ellipse at 50% 30%, #1F2A3E 0%, #15192E 70%, #0A0C18 100%);
    padding: 20px;
}

.event-title {
    font-size: 26px;
    font-weight: bold;
    color: var(--rarity-uncommon);
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.event-illustration {
    width: 360px;
    height: 180px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2A2540 0%, #1A1530 100%);
    border: 3px solid var(--rarity-uncommon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    box-shadow: 0 0 24px rgba(74,156,212,0.2), inset 0 0 40px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
}

.event-illustration::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(74,156,212,0.1) 0%, transparent 70%);
}

.event-text-panel {
    max-width: 500px;
    background: rgba(42,37,32,0.8);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    padding: 20px 24px;
}

.event-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-main);
    font-style: italic;
}

.event-text::before { content: "「"; color: var(--gold); font-size: 20px; }
.event-text::after { content: "」"; color: var(--gold); font-size: 20px; }

.event-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 460px;
}

.event-choice {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: rgba(42,37,32,0.6);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
}

.event-choice:hover {
    background: rgba(61,53,40,0.8);
    border-color: var(--gold);
    transform: translateX(4px);
}

.choice-icon {
    font-size: 24px;
    flex-shrink: 0;
}

.choice-content {
    flex: 1;
}

.choice-label {
    font-size: 15px;
    font-weight: bold;
    color: var(--gold);
}

.choice-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
}
</style>
</head>
<body>

<div class="event-screen">
    <div class="event-title">❓ 神秘事件</div>

    <div class="event-illustration">📖</div>

    <div class="event-text-panel">
        <div class="event-text">
            你在记忆回廊中发现一本古老的日记。翻开它，你感到一股力量涌入脑海。日记的每一页都记载着不同的记忆碎片，但阅读它们需要付出代价...
        </div>
    </div>

    <div class="event-choices">
        <div class="event-choice" onclick="alert('仔细阅读\n获得1张随机卡牌，失去3点血量')">
            <div class="choice-icon">📖</div>
            <div class="choice-content">
                <div class="choice-label">仔细阅读</div>
                <div class="choice-desc">获得 1 张随机卡牌，失去 3 点血量</div>
            </div>
        </div>

        <div class="event-choice" onclick="alert('快速翻阅\n获得15金币')">
            <div class="choice-icon">🏃</div>
            <div class="choice-content">
                <div class="choice-label">快速翻阅</div>
                <div class="choice-desc">获得 15 金币</div>
            </div>
        </div>

        <div class="event-choice" onclick="alert('离开\n无事发生')">
            <div class="choice-icon">🚪</div>
            <div class="choice-content">
                <div class="choice-label">离开</div>
                <div class="choice-desc">无事发生</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
