<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - 卡牌奖励</title>
<link rel="stylesheet" href="common.css">
<style>
.reward-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: radial-gradient(ellipse at 50% 40%, #2A2A3E 0%, #1A1B2E 70%, #0F1020 100%);
}

.reward-title {
    font-size: 28px;
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.reward-subtitle {
    font-size: 16px;
    color: var(--text-dim);
    margin-top: 4px;
}

.reward-cards {
    display: flex;
    gap: 40px;
}

.reward-card {
    width: 200px;
    height: 280px;
    cursor: pointer;
    transition: transform 0.2s ease-out, box-shadow 0.2s;
    position: relative;
}

.reward-card:hover {
    transform: translateY(-12px);
}

.reward-card .card-front {
    width: 100%;
    height: 100%;
    padding: 12px 14px;
}

.reward-card .card-name {
    font-size: 16px;
}

.reward-card .card-effect {
    font-size: 13px;
}

.reward-card .card-tags {
    font-size: 12px;
}

.reward-card:hover .card-front {
    box-shadow: 0 0 24px rgba(212,168,87,0.4);
}

.reward-card.selected .card-front {
    box-shadow: 0 0 32px rgba(91,168,91,0.6);
    border-color: var(--success);
}

.reward-card .glow {
    position: absolute;
    inset: -4px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}

.reward-card:hover .glow {
    opacity: 1;
    box-shadow: 0 0 30px rgba(212,168,87,0.3);
}

.skip-btn {
    margin-top: 8px;
}

.victory-glow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 30%, rgba(212,168,87,0.08) 0%, transparent 60%);
    pointer-events: none;
}
</style>
</head>
<body>

<div class="reward-screen">
    <div class="victory-glow"></div>

    <div style="text-align:center">
        <div class="reward-title">⚔️ 战斗胜利</div>
        <div class="reward-subtitle">选择一张卡牌加入牌组</div>
    </div>

    <div class="reward-cards">
        <!-- 卡牌1 -->
        <div class="reward-card" onclick="selectCard(this, '考据')">
            <div class="glow"></div>
            <div class="card-front card-front-attack">
                <div class="card-name common">考据</div>
                <div class="card-type-row"><span>⚔ 攻击</span><span>普通</span></div>
                <div class="card-effect">
                    造成 <span style="color:var(--danger);font-weight:bold">7</span> 点伤害
                </div>
                <div class="card-tags">
                    [消除] 揭示桌面<br>2张背面牌
                </div>
                <div class="card-rarity-bar common"></div>
            </div>
        </div>

        <!-- 卡牌2 -->
        <div class="reward-card" onclick="selectCard(this, '目录')">
            <div class="glow"></div>
            <div class="card-front card-front-skill">
                <div class="card-name common">目录</div>
                <div class="card-type-row"><span>📜 技能</span><span>普通</span></div>
                <div class="card-effect">
                    获得 <span style="color:var(--block-color);font-weight:bold">5</span> 点格挡
                </div>
                <div class="card-tags">
                    [翻开] 短暂揭示<br>桌面所有牌（3秒）
                </div>
                <div class="card-rarity-bar common"></div>
            </div>
        </div>

        <!-- 卡牌3 -->
        <div class="reward-card" onclick="selectCard(this, '批注')">
            <div class="glow"></div>
            <div class="card-front card-front-attack">
                <div class="card-name common">批注</div>
                <div class="card-type-row"><span>⚔ 攻击</span><span>普通</span></div>
                <div class="card-effect">
                    造成 <span style="color:var(--danger);font-weight:bold">6</span> 点伤害
                </div>
                <div class="card-tags">
                    [翻开] 标记1张<br>背面牌
                </div>
                <div class="card-rarity-bar common"></div>
            </div>
        </div>
    </div>

    <button class="btn btn-secondary skip-btn" onclick="alert('跳过奖励')">跳过（不选）</button>
</div>

<script>
function selectCard(el, name) {
    document.querySelectorAll('.reward-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    setTimeout(() => {
        alert('已选择: ' + name + '\n加入牌组');
    }, 300);
}
</script>

</body>
</html>
