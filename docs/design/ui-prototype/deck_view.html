<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - 牌组查看</title>
<link rel="stylesheet" href="common.css">
<style>
.deck-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 40%, #2A2A3E 0%, #1A1B2E 70%, #0F1020 100%);
}

.deck-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid var(--border-gold);
}

.deck-title {
    font-size: 20px;
    font-weight: bold;
    color: var(--gold);
}

.deck-main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 280px;
    overflow: hidden;
}

.deck-list {
    overflow-y: auto;
    padding: 16px 20px;
}

.deck-category {
    margin-bottom: 20px;
}

.deck-category-title {
    font-size: 15px;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.cat-attack { background: rgba(212,69,69,0.15); border-left: 4px solid var(--type-attack-light); }
.cat-skill { background: rgba(69,119,212,0.15); border-left: 4px solid var(--type-skill-light); }
.cat-ability { background: rgba(155,69,212,0.15); border-left: 4px solid var(--type-ability-light); }
.cat-curse { background: rgba(60,60,60,0.3); border-left: 4px solid var(--type-curse-light); }

.deck-cards-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.mini-card {
    width: 72px;
    height: 96px;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
}

.mini-card:hover {
    transform: translateY(-4px) scale(1.05);
}

.mini-card .card-front {
    width: 100%;
    height: 100%;
    padding: 4px 6px;
    font-size: 8px;
}

.mini-card .card-name { font-size: 9px; }
.mini-card .card-type-row { font-size: 7px; }
.mini-card .card-effect { font-size: 7px; padding: 2px 0; }
.mini-card .card-tags { font-size: 7px; }

.mini-card .card-rarity-bar { height: 2px; }

.card-count-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--gold);
    color: #1A1B2E;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

/* 右侧统计面板 */
.deck-stats {
    background: rgba(42,37,32,0.6);
    border-left: 1px solid var(--border-gold);
    padding: 16px;
    overflow-y: auto;
}

.stats-title {
    font-size: 14px;
    font-weight: bold;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-gold);
}

.stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(74,64,48,0.3);
}

.stat-label { color: var(--text-dim); }
.stat-value { font-weight: bold; }

.stat-attack .stat-value { color: var(--type-attack-light); }
.stat-skill .stat-value { color: var(--type-skill-light); }
.stat-ability .stat-value { color: var(--type-ability-light); }
.stat-curse .stat-value { color: var(--text-dim); }

.duplication-list {
    margin-top: 16px;
}

.duplication-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--gold);
    margin-bottom: 8px;
}

.duplication-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
}

.duplication-item:nth-child(odd) {
    background: rgba(255,255,255,0.03);
}

.dup-count {
    font-weight: bold;
    color: var(--gold);
}
</style>
</head>
<body>

<div class="deck-screen">
    <div class="deck-topbar">
        <div class="icon-btn" onclick="alert('返回')">←</div>
        <div class="deck-title">📦 牌组查看</div>
        <div style="font-size:16px;font-weight:bold;color:var(--gold)">共 15 张</div>
    </div>

    <div class="deck-main">
        <div class="deck-list">
            <!-- 攻击牌 -->
            <div class="deck-category">
                <div class="deck-category-title cat-attack">
                    ⚔️ 攻击牌 <span style="color:var(--text-dim);font-weight:normal;font-size:12px">（7张）</span>
                </div>
                <div class="deck-cards-row">
                    <div class="mini-card">
                        <div class="card-front card-front-attack">
                            <div class="card-name common">笔记</div>
                            <div class="card-type-row"><span>⚔</span></div>
                            <div class="card-effect">6伤害</div>
                            <div class="card-tags">[笔记]</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="card-count-badge">3</div>
                    </div>
                    <div class="mini-card">
                        <div class="card-front card-front-attack">
                            <div class="card-name common">读书笔记</div>
                            <div class="card-type-row"><span>⚔</span></div>
                            <div class="card-effect">8伤害</div>
                            <div class="card-tags">[笔记]<br>[翻开]标记</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="card-count-badge">1</div>
                    </div>
                </div>
            </div>

            <!-- 技能牌 -->
            <div class="deck-category">
                <div class="deck-category-title cat-skill">
                    📜 技能牌 <span style="color:var(--text-dim);font-weight:normal;font-size:12px">（6张）</span>
                </div>
                <div class="deck-cards-row">
                    <div class="mini-card">
                        <div class="card-front card-front-skill">
                            <div class="card-name common">速读</div>
                            <div class="card-type-row"><span>📜</span></div>
                            <div class="card-effect">4格挡</div>
                            <div class="card-tags">[翻开]揭示</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="card-count-badge">3</div>
                    </div>
                    <div class="mini-card">
                        <div class="card-front card-front-skill">
                            <div class="card-name common">笔记本格挡</div>
                            <div class="card-type-row"><span>📜</span></div>
                            <div class="card-effect">6格挡</div>
                            <div class="card-tags">无</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="card-count-badge">2</div>
                    </div>
                </div>
            </div>

            <!-- 能力牌 -->
            <div class="deck-category">
                <div class="deck-category-title cat-ability">
                    💎 能力牌 <span style="color:var(--text-dim);font-weight:normal;font-size:12px">（1张）</span>
                </div>
                <div class="deck-cards-row">
                    <div class="mini-card">
                        <div class="card-front card-front-ability">
                            <div class="card-name common" style="font-size:8px">全神贯注</div>
                            <div class="card-type-row"><span>💎</span></div>
                            <div class="card-effect" style="font-size:6px">每翻牌+1专注</div>
                            <div class="card-tags" style="font-size:6px">[翻开]2格挡</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="card-count-badge">1</div>
                    </div>
                </div>
            </div>

            <!-- 诅咒牌 -->
            <div class="deck-category">
                <div class="deck-category-title cat-curse">
                    💀 诅咒牌 <span style="color:var(--text-dim);font-weight:normal;font-size:12px">（1张）</span>
                </div>
                <div class="deck-cards-row">
                    <div class="mini-card">
                        <div class="card-front card-front-curse">
                            <div class="card-name" style="color:#666">遗忘</div>
                            <div class="card-type-row"><span>💀</span></div>
                            <div class="card-effect" style="color:var(--danger)">失去2血</div>
                            <div class="card-tags">[移除]</div>
                            <div class="card-rarity-bar" style="background:#333"></div>
                        </div>
                        <div class="card-count-badge">1</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计面板 -->
        <div class="deck-stats">
            <div class="stats-title">📊 牌组统计</div>

            <div class="stat-row stat-attack">
                <span class="stat-label">⚔️ 攻击牌</span>
                <span class="stat-value">7</span>
            </div>
            <div class="stat-row stat-skill">
                <span class="stat-label">📜 技能牌</span>
                <span class="stat-value">6</span>
            </div>
            <div class="stat-row stat-ability">
                <span class="stat-label">💎 能力牌</span>
                <span class="stat-value">1</span>
            </div>
            <div class="stat-row stat-curse">
                <span class="stat-label">💀 诅咒牌</span>
                <span class="stat-value">1</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">总牌数</span>
                <span class="stat-value" style="color:var(--gold)">15</span>
            </div>

            <div class="duplication-list">
                <div class="duplication-title">同名分组</div>
                <div class="duplication-item">
                    <span>笔记</span>
                    <span class="dup-count">×3</span>
                </div>
                <div class="duplication-item">
                    <span>速读</span>
                    <span class="dup-count">×3</span>
                </div>
                <div class="duplication-item">
                    <span>笔记本格挡</span>
                    <span class="dup-count">×2</span>
                </div>
                <div class="duplication-item">
                    <span>读书笔记</span>
                    <span class="dup-count">×1</span>
                </div>
                <div class="duplication-item">
                    <span>全神贯注</span>
                    <span class="dup-count">×1</span>
                </div>
                <div class="duplication-item">
                    <span>遗忘</span>
                    <span class="dup-count">×1</span>
                </div>
            </div>

            <div class="duplication-list">
                <div class="duplication-title">匹配词条</div>
                <div class="duplication-item">
                    <span>[笔记]系</span>
                    <span class="dup-count">4张</span>
                </div>
                <div class="duplication-item">
                    <span>[共鸣]系</span>
                    <span class="dup-count">0张</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
