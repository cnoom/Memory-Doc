<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - Meta地图</title>
<link rel="stylesheet" href="common.css">
<style>
.map-screen {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 1fr 60px;
    background: radial-gradient(ellipse at 50% 40%, #2A2A3E 0%, #1A1B2E 70%, #0F1020 100%);
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid var(--border-gold);
}

.topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }

.chapter-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 2px;
}

.map-container {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: auto;
}

.map-grid {
    position: relative;
    width: 600px;
    height: 500px;
}

.node {
    position: absolute;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.2s;
    z-index: 2;
}

.node:hover { transform: scale(1.2); }

.node-battle {
    background: radial-gradient(ellipse at 35% 35%, #D44545 0%, #8B2C2C 70%);
    border: 3px solid #E85555;
    box-shadow: 0 0 12px rgba(199,62,62,0.4);
}
.node-elite {
    background: radial-gradient(ellipse at 35% 35%, #9B45D4 0%, #5B2C8B 70%);
    border: 3px solid #B455E4;
    box-shadow: 0 0 12px rgba(155,69,212,0.4);
    border-radius: 0;
    transform: rotate(45deg);
    width: 40px;
    height: 40px;
}
.node-elite span { transform: rotate(-45deg); }
.node-shop {
    background: radial-gradient(ellipse at 35% 35%, #D4A857 0%, #8B7028 70%);
    border: 3px solid #E8C070;
    box-shadow: 0 0 12px rgba(212,168,87,0.4);
}
.node-campfire {
    background: radial-gradient(ellipse at 35% 35%, #E87B35 0%, #A85020 70%);
    border: 3px solid #F09555;
    box-shadow: 0 0 12px rgba(232,123,53,0.4);
}
.node-event {
    background: radial-gradient(ellipse at 35% 35%, #4A9CD4 0%, #2C5A8B 70%);
    border: 3px solid #6ABCE4;
    box-shadow: 0 0 12px rgba(74,156,212,0.4);
}
.node-boss {
    background: radial-gradient(ellipse at 35% 35%, #E84A20 0%, #8B2C10 70%);
    border: 4px solid #FF6A40;
    box-shadow: 0 0 20px rgba(232,74,32,0.6);
    width: 56px;
    height: 56px;
    font-size: 28px;
}

.node-current {
    border-color: #FFFFFF !important;
    box-shadow: 0 0 20px rgba(255,255,255,0.6) !important;
    animation: pulse-white 1.5s ease-in-out infinite;
}

@keyframes pulse-white {
    0%,100% { box-shadow: 0 0 16px rgba(255,255,255,0.4); }
    50% { box-shadow: 0 0 28px rgba(255,255,255,0.8); }
}

.node-available {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
    animation: pulse-gold-outline 2s ease-in-out infinite;
}

@keyframes pulse-gold-outline {
    0%,100% { outline-color: rgba(212,168,87,0.5); }
    50% { outline-color: rgba(212,168,87,1); }
}

.node-visited {
    opacity: 0.3;
    filter: grayscale(0.7);
}

.node-unreachable {
    opacity: 0.4;
    filter: grayscale(0.5);
}

.path-line {
    position: absolute;
    z-index: 1;
    pointer-events: none;
}

.path-line-available {
    stroke: var(--gold);
    stroke-width: 3;
    stroke-dasharray: 6 4;
    animation: dash-flow 1s linear infinite;
}

@keyframes dash-flow {
    to { stroke-dashoffset: -10; }
}

.path-line-visited {
    stroke: rgba(74,64,48,0.5);
    stroke-width: 2;
}

.path-line-unreachable {
    stroke: rgba(74,64,48,0.2);
    stroke-width: 1;
    stroke-dasharray: 3 3;
}

.bottombar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: rgba(0,0,0,0.5);
    border-top: 1px solid var(--border-gold);
}

.bottombar-left, .bottombar-right { display: flex; align-items: center; gap: 12px; }

.character-info {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    border: 1px solid var(--border-gold);
}

.character-portrait {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 35% 35%, #4A9CD4, #2C5A8B);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.player-hp-mini {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    color: var(--danger);
    font-weight: bold;
}

.node-tooltip {
    position: fixed;
    background: var(--bg-panel);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.15s;
    white-space: nowrap;
}

.node-tooltip.visible { opacity: 1; }

.tooltip-title { font-weight: bold; color: var(--gold); margin-bottom: 2px; }
</style>
</head>
<body>

<div class="map-screen">
    <div class="topbar">
        <div class="topbar-left">
            <div class="icon-btn" onclick="alert('返回主菜单')">←</div>
            <div class="chapter-title">第1章 — 记忆回廊</div>
        </div>
        <div class="topbar-right">
            <div class="gold-display">💰 150</div>
            <div class="icon-btn" onclick="alert('牌组查看')">📦</div>
            <div class="icon-btn">⚙</div>
        </div>
    </div>

    <div class="map-container">
        <svg class="path-line" style="position:absolute;top:0;left:0;width:600px;height:500px">
            <!-- 路径连线 -->
            <!-- 第1层 → 第2层 -->
            <line x1="300" y1="50" x2="180" y2="120" class="path-line-visited"/>
            <line x1="300" y1="50" x2="420" y2="120" class="path-line-unreachable"/>
            <!-- 第2层 → 第3层 -->
            <line x1="180" y1="120" x2="100" y2="200" class="path-line-visited"/>
            <line x1="180" y1="120" x2="300" y2="200" class="path-line-visited"/>
            <line x1="420" y1="120" x2="300" y2="200" class="path-line-unreachable"/>
            <line x1="420" y1="120" x2="500" y2="200" class="path-line-unreachable"/>
            <!-- 第3层 → 第4层 -->
            <line x1="100" y1="200" x2="180" y2="280" class="path-line-visited"/>
            <line x1="300" y1="200" x2="180" y2="280" class="path-line-visited"/>
            <line x1="300" y1="200" x2="420" y2="280" class="path-line-available"/>
            <line x1="500" y1="200" x2="420" y2="280" class="path-line-unreachable"/>
            <!-- 第4层 → 第5层 -->
            <line x1="180" y1="280" x2="100" y2="360" class="path-line-unreachable"/>
            <line x1="180" y1="280" x2="300" y2="360" class="path-line-available"/>
            <line x1="420" y1="280" x2="300" y2="360" class="path-line-unreachable"/>
            <line x1="420" y1="280" x2="500" y2="360" class="path-line-unreachable"/>
            <!-- 第5层 → Boss -->
            <line x1="100" y1="360" x2="300" y2="450" class="path-line-unreachable"/>
            <line x1="300" y1="360" x2="300" y2="450" class="path-line-unreachable"/>
            <line x1="500" y1="360" x2="300" y2="450" class="path-line-unreachable"/>
        </svg>

        <div class="map-grid">
            <!-- 第1层：起点 -->
            <div class="node node-battle node-visited" style="left:278px;top:8px" data-tooltip="战斗（已完成）">⚔️</div>

            <!-- 第2层 -->
            <div class="node node-campfire node-visited" style="left:158px;top:78px" data-tooltip="篝火（已休息）">🔥</div>
            <div class="node node-event node-unreachable" style="left:398px;top:78px" data-tooltip="随机事件">❓</div>

            <!-- 第3层 -->
            <div class="node node-battle node-visited" style="left:78px;top:158px" data-tooltip="战斗（已完成）">⚔️</div>
            <div class="node node-shop node-current" style="left:278px;top:158px" data-tooltip="商店（当前位置）">💰</div>
            <div class="node node-battle node-unreachable" style="left:478px;top:158px" data-tooltip="战斗">⚔️</div>

            <!-- 第4层 -->
            <div class="node node-battle node-unreachable" style="left:158px;top:238px" data-tooltip="战斗">⚔️</div>
            <div class="node node-elite node-available" style="left:278px;top:238px" data-tooltip="精英战斗（必掉遗物）"><span>⭐</span></div>
            <div class="node node-battle node-unreachable" style="left:398px;top:238px" data-tooltip="战斗">⚔️</div>

            <!-- 第5层 -->
            <div class="node node-event node-unreachable" style="left:78px;top:318px" data-tooltip="随机事件">❓</div>
            <div class="node node-campfire node-unreachable" style="left:278px;top:318px" data-tooltip="篝火">🔥</div>
            <div class="node node-battle node-unreachable" style="left:478px;top:318px" data-tooltip="战斗">⚔️</div>

            <!-- Boss -->
            <div class="node node-boss node-unreachable" style="left:272px;top:420px" data-tooltip="Boss：记忆吞噬者">👑</div>
        </div>
    </div>

    <div class="bottombar">
        <div class="bottombar-left">
            <div class="relic-slot" title="记忆水晶">🔮</div>
            <div class="relic-slot rarity-uncommon" title="蓄能水晶">⚡</div>
            <div class="relic-slot" title="急救包">💊</div>
        </div>
        <div class="bottombar-right">
            <div class="potion-bar">
                <div class="potion-slot filled" title="时间药水">⏳</div>
                <div class="potion-slot filled" title="透视药水">👁</div>
                <div class="potion-slot empty">—</div>
            </div>
            <div class="character-info">
                <div class="character-portrait">📚</div>
                <span style="font-weight:bold;font-size:13px">学者</span>
                <div class="player-hp-mini">❤️ 48/60</div>
            </div>
        </div>
    </div>
</div>

<div class="node-tooltip" id="nodeTooltip">
    <div class="tooltip-title"></div>
    <div class="tooltip-desc"></div>
</div>

<script>
document.querySelectorAll('.node').forEach(node => {
    node.addEventListener('mouseenter', function(e) {
        const tooltip = document.getElementById('nodeTooltip');
        tooltip.querySelector('.tooltip-title').textContent = this.dataset.tooltip;
        tooltip.classList.add('visible');
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY - 30) + 'px';
    });
    node.addEventListener('mouseleave', function() {
        document.getElementById('nodeTooltip').classList.remove('visible');
    });
    node.addEventListener('click', function() {
        if (this.classList.contains('node-available')) {
            alert('前往: ' + this.dataset.tooltip);
        }
    });
});
</script>

</body>
</html>
