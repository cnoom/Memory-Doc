<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆勇者 - 商店</title>
<link rel="stylesheet" href="common.css">
<style>
.shop-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 40%, #2A2820 0%, #1A1815 70%, #0F0E0A 100%);
}

.shop-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(0,0,0,0.4);
    border-bottom: 2px solid var(--gold);
}

.shop-title {
    font-size: 24px;
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 3px;
}

.shop-content {
    flex: 1;
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
    padding: 20px;
    overflow: auto;
}

.shop-left, .shop-right {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.shop-section {
    background: rgba(42,37,32,0.6);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    padding: 16px;
}

.shop-section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-gold);
}

.shop-items {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

.shop-card {
    width: 130px;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
}

.shop-card:hover { transform: translateY(-4px); }

.shop-card .card-front {
    width: 100%;
    height: 180px;
    padding: 8px 10px;
    font-size: 10px;
}

.shop-card .card-name { font-size: 12px; }

.price-tag {
    text-align: center;
    margin-top: 6px;
    padding: 4px 12px;
    background: rgba(212,168,87,0.15);
    border: 1px solid var(--gold);
    border-radius: 4px;
    color: var(--gold);
    font-weight: bold;
    font-size: 14px;
}

.price-tag:hover {
    background: rgba(212,168,87,0.3);
}

.price-tag.sold {
    opacity: 0.3;
    cursor: not-allowed;
    text-decoration: line-through;
}

.shop-relic {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-gold);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
}

.shop-relic:hover {
    background: rgba(212,168,87,0.1);
    border-color: var(--gold);
}

.relic-icon-large {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: rgba(0,0,0,0.3);
    flex-shrink: 0;
}

.relic-icon-large.rarity-uncommon { border-color: var(--rarity-uncommon); }
.relic-icon-large.rarity-rare { border-color: var(--rarity-rare); }

.relic-info { flex: 1; }
.relic-name { font-weight: bold; font-size: 14px; }
.relic-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

.remove-card-service {
    padding: 16px;
    background: rgba(199,62,62,0.1);
    border: 1px dashed var(--danger);
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
}

.remove-card-service:hover {
    background: rgba(199,62,62,0.2);
    border-style: solid;
}

.remove-card-service .title {
    font-size: 16px;
    font-weight: bold;
    color: var(--danger);
}

.remove-card-service .desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
}

.remove-card-service .price {
    margin-top: 8px;
    font-size: 18px;
    font-weight: bold;
    color: var(--gold);
}
</style>
</head>
<body>

<div class="shop-screen">
    <div class="shop-topbar">
        <div class="icon-btn" onclick="alert('返回地图')">←</div>
        <div class="shop-title">💰 商店</div>
        <div class="gold-display" style="font-size:20px">💰 150</div>
    </div>

    <div class="shop-content">
        <div class="shop-left">
            <!-- 卡牌出售 -->
            <div class="shop-section">
                <div class="shop-section-title">📜 卡牌出售</div>
                <div class="shop-items">
                    <div class="shop-card" onclick="buyItem(this)">
                        <div class="card-front card-front-attack">
                            <div class="card-name uncommon">交叉引用</div>
                            <div class="card-type-row"><span>⚔ 攻击</span><span>罕见</span></div>
                            <div class="card-effect">造成7伤害</div>
                            <div class="card-tags">[共鸣]<br>[翻开] 揭示邻2张</div>
                            <div class="card-rarity-bar uncommon"></div>
                        </div>
                        <div class="price-tag">💰 75G</div>
                    </div>

                    <div class="shop-card" onclick="buyItem(this)">
                        <div class="card-front card-front-skill">
                            <div class="card-name common">索引</div>
                            <div class="card-type-row"><span>📜 技能</span><span>普通</span></div>
                            <div class="card-effect">获得3格挡</div>
                            <div class="card-tags">[翻开] 标记1张</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="price-tag">💰 45G</div>
                    </div>

                    <div class="shop-card" onclick="buyItem(this)">
                        <div class="card-front card-front-ability">
                            <div class="card-name common">博闻强识</div>
                            <div class="card-type-row"><span>💎 能力</span><span>普通</span></div>
                            <div class="card-effect" style="font-size:9px">♦ 攻击牌+1伤害<br>◆ [翻开] 揭示3张</div>
                            <div class="card-rarity-bar common"></div>
                        </div>
                        <div class="price-tag">💰 60G</div>
                    </div>
                </div>
            </div>

            <!-- 道具出售 -->
            <div class="shop-section">
                <div class="shop-section-title">🧪 道具出售</div>
                <div class="shop-items">
                    <div class="shop-card" style="width:100px" onclick="buyItem(this)">
                        <div class="potion-slot filled" style="width:100px;height:100px;font-size:36px;border-radius:8px">⏳</div>
                        <div style="text-align:center;font-size:11px;margin-top:4px">时间药水</div>
                        <div class="price-tag">💰 50G</div>
                    </div>
                    <div class="shop-card" style="width:100px" onclick="buyItem(this)">
                        <div class="potion-slot filled" style="width:100px;height:100px;font-size:36px;border-radius:8px">🛡️</div>
                        <div style="text-align:center;font-size:11px;margin-top:4px">格挡药水</div>
                        <div class="price-tag">💰 50G</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="shop-right">
            <!-- 遗物出售 -->
            <div class="shop-section">
                <div class="shop-section-title">🔮 遗物出售</div>
                <div style="display:flex;flex-direction:column;gap:8px">
                    <div class="shop-relic" onclick="buyRelic(this)">
                        <div class="relic-icon-large rarity-uncommon">⚡</div>
                        <div class="relic-info">
                            <div class="relic-name">蓄能水晶</div>
                            <div class="relic-desc">连续3次配对后，下次配对+5伤害</div>
                        </div>
                        <div class="price-tag" style="margin:0">120G</div>
                    </div>

                    <div class="shop-relic" onclick="buyRelic(this)">
                        <div class="relic-icon-large">🦷</div>
                        <div class="relic-info">
                            <div class="relic-name">吸血鬼之牙</div>
                            <div class="relic-desc">每3次配对消除回1点血量</div>
                        </div>
                        <div class="price-tag" style="margin:0">100G</div>
                    </div>
                </div>
            </div>

            <!-- 移除卡牌 -->
            <div class="shop-section">
                <div class="shop-section-title">✂ 移除卡牌</div>
                <div class="remove-card-service" onclick="alert('选择一张牌组中的牌移除')">
                    <div class="title">✂ 移除一张卡牌</div>
                    <div class="desc">从牌组中永久移除一张牌</div>
                    <div class="price">💰 75G</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function buyItem(el) {
    const price = el.querySelector('.price-tag');
    if (!price.classList.contains('sold')) {
        price.classList.add('sold');
        price.textContent = '已售出';
    }
}

function buyRelic(el) {
    const price = el.querySelector('.price-tag');
    if (!price.classList.contains('sold')) {
        price.classList.add('sold');
        price.textContent = '已售出';
        el.style.opacity = '0.4';
    }
}
</script>

</body>
</html>
