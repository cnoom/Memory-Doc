<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>T01 通用特效预览</title><style>
*{box-sizing:border-box}body{margin:30px;background:#202a2d;color:#f1eee2;font:18px sans-serif}button{font:inherit;padding:8px 20px;cursor:pointer}main{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:20px}section{border:1px solid #87918a;padding:18px}.stage{height:330px;background:#e7e5d8;display:grid;place-items:center;overflow:hidden}.dark .stage{background:#253238}.stage img{width:300px;height:300px;object-fit:contain}.play .hit{animation:hit 280ms ease-out forwards}.play .match{animation:match 400ms ease-out forwards}.play .heal{animation:heal 800ms ease-out forwards}.play .fire{transform-origin:50% 91%;animation:fire 1600ms ease-in-out 3}p{font-size:16px;color:#c3c7bc}@keyframes hit{0%{opacity:0;transform:scale(.65)}20%{opacity:1;transform:scale(1.05)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}@keyframes match{0%{opacity:0;transform:scale(.65)}15%{opacity:1}100%{opacity:0;transform:scale(1.15) rotate(6deg)}}@keyframes heal{0%{opacity:0;transform:translateY(15px) scale(.9)}20%{opacity:.85}100%{opacity:0;transform:translateY(-24px) scale(1.03)}}@keyframes fire{0%,100%{transform:scale(.98,1);opacity:.9}35%{transform:scale(1.02,.97);opacity:1}70%{transform:scale(.97,1.03);opacity:.92}}@media(prefers-reduced-motion:reduce){.play img{animation-duration:1ms!important;animation-iteration-count:1!important}}
</style><h1>T01 通用特效 · 已确认设计参考</h1><p>单张透明贴图＋程序动画参考；不包含游戏逻辑或逐帧动画。火焰每次播放三轮。</p><button id="theme">切换明暗背景</button><main></main><script>
const rows=[['hit','命中斩痕','280ms，叠在命中点，伤害数字独立。'],['match_dissolve','配对碎纸消散','400ms，保留卡牌原格心，整体扩散淡出。'],['heal','治疗光屑','800ms，向上24px，避开角色脸部与血量文字。'],['campfire_flame','篝火火焰','1600ms一轮，根部固定，轻微形变。']];
const cls=['hit','match','heal','fire'];document.querySelector('main').innerHTML=rows.map((r,i)=>`<section><h2>${r[1]}</h2><div class="stage"><img class="${cls[i]}" src="assets/fx_${r[0]}_t01.png" alt="${r[1]}"></div><p>${r[2]}</p><button>播放</button></section>`).join('');document.querySelectorAll('section button').forEach(b=>b.onclick=()=>{const s=b.closest('section');s.classList.remove('play');void s.offsetWidth;s.classList.add('play')});document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></html>
